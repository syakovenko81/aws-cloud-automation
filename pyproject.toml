[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloud-automation"
version = "0.1.0"
description = "A practical DevOps automation CLI for EC2, S3, and ECR using Boto3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
aws-automation = "aws_automation.cli:main"

[tool.setuptools]
package-dir = {"" = "aws_automation"}

[tool.setuptools.packages.find]
where = ["aws_automation"]

